<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pokédex</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-6 col-lg-4">

        <div class="card shadow borda-roxa border-2">
          <div class="card-header cabecalho-roxo text-white text-center">
            <h1 class="h4 mb-0">Pokédex</h1>
          </div>

          <div class="card-body">

            <form id="form-busca" class="input-group mb-3">
              <input type="text" id="campo-busca" class="form-control"
                     placeholder="Nome ou número (ex: pikachu, 25)" value="pikachu" autocomplete="off">
              <button class="btn btn-roxo" type="submit">Buscar</button>
            </form>

            <div id="mensagem" class="alert d-none" role="alert"></div>

            <div id="resultado">
              <div class="text-center mb-3">
                <div class="imagem-moldura mx-auto">
                  <img id="img-pokemon" class="pixelada" alt="Imagem do Pokémon">
                </div>
              </div>

              <h2 id="nome" class="h5 text-center text-capitalize mb-3"></h2>

              <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item d-flex justify-content-between">
                  <span>Tipo</span><span id="tipos"></span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                  <span>Altura</span><strong id="altura"></strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                  <span>Peso</span><strong id="peso"></strong>
                </li>
              </ul>

              <div id="stats"></div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
